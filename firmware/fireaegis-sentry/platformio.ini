; FireAegis 前线固件 · PlatformIO 配置（软件组核对版）
;
; 结论先说：**这份配置基本不用改**，队友原来的依赖和板子参数都是对的。
; 我只加了两个不影响原有成功编译的小东西：
;   1) monitor_filters —— 串口里中文/崩溃信息更好读（崩溃会自动解码出调用栈）
;   2) 注释说明为什么 Ethernet 库版本不能降
;
; 关键点：新的 main.cpp 用的是"带静态 IP 的 Ethernet.begin(mac, ip, dns, gateway, subnet)"
; 这个重载 + Ethernet.init(cs) + Ethernet.linkStatus() 都是 arduino-libraries/Ethernet
; 2.0.2 及以上才有的，所以 lib_deps 里那条 ^2.0.2 必须保留，不要降到 1.x。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 串口：115200，加解码器和时间戳（崩溃时能看到函数名和调用栈）
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters =
    esp32_exception_decoder
    time

; 摄像头要用 PSRAM 做帧缓冲，这两行必须保留
board_build.arduino.memory_type = qio_opi
build_flags =
    -D BOARD_HAS_PSRAM

; 烧录前后复位，保持原样
upload_flags =
    --before=default_reset
    --after=hard_reset

lib_deps =
    adafruit/Adafruit MLX90640 @ ^1.1.2
    adafruit/Adafruit BusIO @ ^1.16.0
    Wire
    SPI
    bblanchon/ArduinoJson @ ^6.21.3
    ; W5500 有线网卡：^2.0.2 才有静态 IP 版 begin()，别降级
    arduino-libraries/Ethernet @ ^2.0.2
